name: deploy-to-preview

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**docker**'
      - '.gitignore'
      - '.vscode/**'
      - 'README.md'
      - 'compose.yaml'

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-26.04
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch' }}
    environment:
      name: preview-cloudflare
      url: ${{ steps.deployment.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build
        with:
          sops-age-key: ${{ secrets.SOPS_AGE_KEY }}
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        id: deployment
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=jacem --branch=${{ github.head_ref || github.ref_name }}
      - name: Comment on PR with the preview URL
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: cloudflare-preview
          message: |
            Preview: ${{ steps.deployment.outputs.deployment-url }}
      - run: rm -rf dist
